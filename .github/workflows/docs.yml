name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - name: Generate stripped README & LOG for preview
        run: |
          sed -E 's/\[([^]]+)\]\([^)]+\)/\1/g' README.md > doc-includes/README-stripped.md
          sed -E 's/\[([^]]+)\]\([^)]+\)/\1/g' LOG.md > doc-includes/LOG-stripped.md
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
