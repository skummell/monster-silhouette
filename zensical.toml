[project]
site_url = "https://skummell.github.io/monster-silhouette/"
site_name = "Monster Silhouette - Source Code Docs"
site_description = "Source Code Documentation for Monster Silhouette, Ren'py Visual Novel RPG."
site_author = "skummell"

copyright = "Copyright &copy; 2026 SkumMell"

repo_url = "https://github.com/skummell/monster-silhouette"
repo_name = "skummell/monster-silhouette"
# edit_uri = "edit/main/docs/"

nav = [
  { "Introduction" = "index.md" },
  { "Gameplay Mechanics" = [
      "mechanics/story-mode.md",
      "mechanics/computer-ui.md",
      "mechanics/prep-wrap.md",
      "mechanics/days-hud.md",
      "mechanics/hovers-tooltips.md", 
  ] },
  { "Documentation" = [
    { "Settings & Options" = "settings-options.md", },
    { "Custom Actions" = "custom-actions.md", },
    { 
      "Game Screens" = [
        "screens/template-screens.md",
        "screens/meta-screens.md",
        "screens/overlay-screens.md", 
        "screens/computer-ui-screens.md", 
        "screens/app-screens.md", 
        "screens/game-mode-screens.md",
    ] },
    {
      "Game Systems" = [
        "systems/scene-system.md",
        "systems/button-disabler-system.md", 
        "systems/chat-system.md",
        "systems/draft-system.md",
        "systems/freeze-system.md", 
        "systems/game-mode-system.md", 
    ] },
  ] },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.extra.status]
new = "Recently added"
deprecated = "Outdated or superseded"
modified = "Recently modified"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
pymdownx.snippets.auto_append = [
  "doc-includes/abbreviations.md",
  "doc-includes/references.md",
]

[project.theme.icon.admonition]
folder = "octicons/file-directory-fill-24"
file = "octicons/file-24"

[project.plugins.tags]

[project.extra.tags]
"Last Updated" = "hash"

[project.theme.icon.tag]
default = ""
hash = "lucide/hash"